model:
  target: models.network_swinir_post_v3.SwinIRPostV3
  params:
    temporal_fusion_mode: 'mean'
    img_size: 64
    upscale: 3
    upsampler: 'pixelshuffle'
    window_size: 8
    embed_dim: 180
    depths: [6, 6, 6, 6]
    num_heads: [6, 6, 6, 6]
    mlp_ratio: 4
    resi_connection: '1conv'
    out_channels: 64
    fusion_module: 'lightweight_channel_attention'
    use_cross_attention: true
    cross_num_heads: 6
    cross_downsample_rate: 1
    cross_concat_value: false
    use_pos_emb: false
    use_learnable_pos_emb: false
    pos_emb_dim: 0
    temporal_attention_params:
      num_heads: 6

    use_spectral_postprocessor: true
    spectral_postprocessor_type: 'scheme3_plus6'
    spectral_postprocessor_params:
      scheme3:
        n_channels: 64
        split_ratio: 0.5
        split_mode: 'variance_dynamic'
      scheme6:
        n_channels: 64
        hidden_channels: 12
      compose:
        use_learnable_gates: false
        fixed_alpha: 1.0
        fixed_beta: 1.0
        staged_training:
          enabled: true
          warmup_steps: 1200
          ramp_steps: 600
          first_scale_warmup: 1.0
          second_scale_warmup: 0.0
          first_scale_final: 1.0
          second_scale_final: 1.0

data:
  train:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      lr_dir: "./data/processed_data/train/LR"
      hr_dir: "./data/processed_data/train/HR"
      sample_num: 16
  val:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      lr_dir: "./data/processed_data/val/LR"
      hr_dir: "./data/processed_data/val/HR"
      sample_num: 8
  test:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      lr_dir: "./data/processed_data/test/LR"
      hr_dir: "./data/processed_data/test/HR"
      sample_num: 8

trainer:
  target: trainer_mask_ablation.TrainerAlphaSRMaskTemporalLossAblation

loss:
  target: trainer.MixedLoss
  params:
    ssim_weight: 1.0
    l2_weight: 1.0
    data_range: 2.0

features:
  time_band:
    enabled: true
  mask_band:
    enabled: true
    use_advanced_processor: true
    processor:
      mask_type: "soft"
      use_spatial_smoothing: true
      smoothing_sigma: 1.0
      soft_mask_sigma: 2.0

train:
  save_dir: "./training_logs/experiments_mainline_4d_v3/ablation_4d_v3_5f_scheme3_plus6_stage_full"
  batch: [1, 1]
  iterations: 5000
  lr: 0.0001
  lr_schedule: "ReduceLROnPlateau"
  lr_schedule_params:
    patience: 5
    factor: 0.5
  lr_min: 0.000001
  weight_decay: 0.0
  global_seeding: true
  seed: 42
  num_workers: 4
  log_freq: [100, 200, 200]
  save_freq: 500
  val_freq: 50
  rgb_chn: [2, 1, 0]
  local_logging: true
  temporal_loss_reduce: "weighted_mean"
  use_indicating_mask_in_training: true
  indicating_mask_reduce: "prob_or"

inference:
  padding_offset: 16
