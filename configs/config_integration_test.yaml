# 文件路径: configs/config_integration_test.yaml
# 这是一个专门用于快速集成测试的配置文件

# 【核心】导入并继承您的主配置文件
defaults:
  - config_swinir.yaml

# ==========================================================
# 【覆盖】修改以下参数以进行快速测试
# ==========================================================

data:
  train:
    params:
      # 【修改】使用您指定的绝对路径
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/train/LR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/train/HR"
      # 【核心】仅使用少量样本进行快速测试
      sample_num: 16  # <-- 使用少量样本，例如16个，确保一个batch能跑起来

  val:
    params:
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/val/LR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/val/HR"
      sample_num: 8 # 验证集也用少量样本

  test: # 为推理测试预留
    params:
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/test/LR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/test/HR"
      sample_num: 8

train:
  # 【修改】大幅缩短训练参数
  experiment_name: "integration_test" # <-- 独立的日志目录
  save_dir: "./training_logs/integration_tests" # 保存到专门的测试日志目录
  batch: [8, 4] # [train_batch, val_batch], 根据 sample_num 调整
  iterations: 10 # <-- 只跑10次迭代就足够验证流程
  log_freq: [2, 10, 10]
  save_freq: 5
  val_freq: 5 # 确保在10次迭代内至少跑一次验证
  num_workers: 4 # 可以适当调低
