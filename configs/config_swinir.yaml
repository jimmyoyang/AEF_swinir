# 3. 训练器配置
# ----------------------------------------------------
trainer:
  target: trainer.TrainerAlphaSR

# 4. 【新增】损失函数配置
# ----------------------------------------------------
loss:
  target: trainer.MixedLoss  # <-- 指向我们在 trainer.py 中定义的类
  params:
    ssim_weight: 1.0   # <-- SSIM损失的权重，现在可以在这里调整
    l2_weight: 1.0     # <-- L2 (MSE) 损失的权重，现在可以在这里调整
    data_range: 2.0    # <-- 损失函数需要知道数据的动态范围，因为我们归一化到[-1, 1]，所以范围是2.0
    
# 5. 【新增】特征注入开关 (用于A/B实验)
# ----------------------------------------------------
features:
  # 时间特征：将“年份积日(DOY)”作为一个额外通道
  time_band:
    enabled: true        # <-- 开关1: 设为 false 可运行“纯SwinIR”基线实验
  
  # 掩膜特征：将“有效像素掩膜”作为一个额外通道
  mask_band:
    enabled: true        # <-- 开关2: 设为 false 可单独验证时间特征的效果

# 6. 训练参数
# ----------------------------------------------------
train:
  # 【修改】建议使用一个更通用的保存目录
  save_dir: "./training_logs/anytime_swinir" 
  batch: [1, 1] # [train_batch_size, val_batch_size]
  iterations: 20000 # 针对大规模数据集
  lr: 0.0001
  lr_schedule: "ReduceLROnPlateau"
  lr_schedule_params:
    patience: 5
    factor: 0.5
  lr_min: 0.000001
  weight_decay: 0.0
  global_seeding: True
  seed: 42
  num_workers: 48
  
  # 日志与保存频率
  log_freq: [100, 200, 200]
  save_freq: 1000
  val_freq: 500
  
  # 可视化相关
  rgb_chn: [2, 1, 0] # Landsat: Red(B4), Green(B3), Blue(B2) -> 对应索引
  local_logging: True

# 7. 推理配置
# ----------------------------------------------------
inference:
  padding_offset: 16
