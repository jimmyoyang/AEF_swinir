# 文件路径: configs/config_swinir.yaml
# (最终版 - 清理、规范化、并增加了A/B实验开关)

# 1. 模型配置
# ----------------------------------------------------
model:
  target: models.network_swinir.SwinIR
  params:
    # --- 【核心修改】新增时序融合模式开关 ---
    temporal_fusion_mode: 'mean' # <--- 步骤一，使用平均融合。未来切换到步骤二，只需改为 'attention'
    
    # --- 模型核心尺寸与上采样策略 ---
    img_size: 64          # 模型主体将在64x64的LR空间进行计算
    upscale: 3
    # --- 核心修改：启用后置上采样 ---
    upsampler: 'pixelshuffle' # 在网络末端使用PixelShuffle进行高效上采样

    # --- SwinIR 核心结构参数 ---
    window_size: 8
    embed_dim: 180
    depths: [6, 6, 6, 6]
    num_heads: [6, 6, 6, 6]
    mlp_ratio: 4
    resi_connection: '1conv'

    # --- 输入/输出通道 ---
    # 'in_chans' 将由 trainer.py 在运行时动态确定，无需在此处硬编码。
    # 这使得模型能自动适应不同时相长度的数据集。
    # out_channels: 3
    out_channels: 64

    # --- 融合模块 (保留您的设计) ---
    fusion_module: 'lightweight_channel_attention' # 可选: 'simple_concat', 'low_rank_fusion'

    # --- 【预留空间】为 'attention' 模式预留参数 ---
    temporal_attention_params:
      num_heads: 6
# 2. 数据配置
# ----------------------------------------------------
data:
  train:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      # 【修改】使用您指定的绝对路径
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/train/LR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/train/HR"
      # 【核心】仅使用少量样本进行快速测试
      sample_num: 16  # <-- 使用少量样本，例如16个，确保一个batch能跑起来

  val:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/val/LR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/val/HR"
      sample_num: 8 # 验证集也用少量样本

  test: # 为推理测试预留
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/test/LR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/Cloud_test/processed_data_SR_10m/test/HR"
      sample_num: 8
