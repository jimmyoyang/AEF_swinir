model:
  target: models.network_swinir.SwinIR
  params:
    temporal_fusion_mode: 'mean'
    img_size: 64
    upscale: 3
    upsampler: 'pixelshuffle'
    window_size: 8
    embed_dim: 180
    depths: [6, 6, 6, 6]
    num_heads: [6, 6, 6, 6]
    mlp_ratio: 4
    resi_connection: '1conv'
    out_channels: 64
    fusion_module: 'lightweight_channel_attention'
    use_cross_attention: false  # 关闭cross attention
    cross_num_heads: 6
    cross_downsample_rate: 1
    cross_concat_value: false
    use_pos_emb: true
    use_learnable_pos_emb: true
    pos_emb_dim: 180
    temporal_attention_params:
      num_heads: 6

data:
  train:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      # lr_dir: "./data/processed_data_SR_10m_2/train/LR"
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data_SR_10m_32samples/train/LR"
      # hr_dir: "./data/processed_data_SR_10m_2/train/HR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data_SR_10m_32samples/train/HR"
      sample_num: 16      
      enable_hr_zero_filter: true
      hr_zero_ratio_filter_threshold: 0.05
      hr_zero_ratio_manifest: "./patch_stats.log"
      cache_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data_SR_10m_32samples/cache/train"
      use_tile_cache: true  
  val:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      # lr_dir: "./data/processed_data_SR_10m_2/val/LR"
      lr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data_SR_10m_32samples/val/LR"
      # hr_dir: "./data/processed_data_SR_10m_2/val/HR"
      hr_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data_SR_10m_32samples/val/HR"
      sample_num: 8
      enable_hr_zero_filter: true
      hr_zero_ratio_filter_threshold: 0.05
      hr_zero_ratio_manifest: "./patch_stats.log"
      cache_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data_SR_10m_32samples/cache/val"
      use_tile_cache: true  
  test:
    target: datapipe.datasets.AnytimeTemporalDataset
    params:
      lr_dir: "./data/processed_data/test/LR"
      hr_dir: "./data/processed_data/test/HR"
      enable_hr_zero_filter: true
      hr_zero_ratio_filter_threshold: 0.05
      hr_zero_ratio_manifest: "./patch_stats.log"
      sample_num: 8      
      # cache_dir: "/mnt/lm_data_afs/wangzining/charles/AEF_swinir/data/processed_data/cache/test"
      # use_tile_cache: true

trainer:
  target: trainer_mask_ablation.TrainerAlphaSRMaskAblation

loss:
  target: trainer.MixedLoss
  params:
    ssim_weight: 1.0
    l2_weight: 1.0
    data_range: 2.0

features:
  time_band:
    enabled: true
  mask_band:
    enabled: true
    use_advanced_processor: true
    processor:
      mask_type: "soft"
      use_spatial_smoothing: true
      smoothing_sigma: 1.0
      soft_mask_sigma: 2.0

train:
  save_dir: "./training_logs/experiments/ablation_4f_mask_prob_or_learnable_pos_no_cross"
  # batch: [1, 1]
  batch: [16, 8]
  iterations: 20000
  lr: 0.0001
  # 实际仅用 ReduceLROnPlateau(mode=max)，监控验证 PSNR；仅当 PSNR 连续 patience 次未创新高时才乘 factor 降 LR。
  # 若 PSNR 每次微涨则 LR 长期不降：可降低 patience、或加大 threshold（避免噪声算“提升”）、或略增大 val_freq。
  lr_schedule: "ReduceLROnPlateau"
  lr_schedule_params:
    patience: 3
    factor: 0.5
    threshold: 0.02
    threshold_mode: abs
    min_lr: 1.0e-6
  lr_min: 0.000001
  weight_decay: 0.0
  global_seeding: true
  seed: 42
  # num_workers: 4
  num_workers: 0
  log_freq: [100, 200, 200]
  save_freq: 500
  val_freq: 500
  rgb_chn: [2, 1, 0]
  local_logging: true
  indicating_mask_reduce: "prob_or"

inference:
  padding_offset: 16
